<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/stylesheet.css">
  <title>Dash groceries</title>
</head>
<body>
  <div class="nav-wrapper">
    <nav>
      <ul class="nav-list">
        <li class="nav_item"><a href="index.html">Home</a></li>
        <li><a href="#">Login</a></li>
        <li><a href="#">Order Online</a></li>
        <li><a href="#">About Us</a></li>
      </ul>
    </nav>
  </div>


  <div class="image-holder">
    <img class="background-img" src="images/background-img.jpg" alt="background_image" width="100%">
    <h1 id="caption-1">GROCERY SHOPPING DONE ONLINE</h1>
  </div>

  
    <h1 id="pop-cat">POPULAR CATEGORIES</h1>
    <hr width ="1300">

    <div class="featured-wrapper">

      <!-- THIS IS THE DAIRY CATEGORY -->
    
    <div class="product-container">
      <p class="cat-text">Diary products</p>
      <img src="images/dairy_img.jpg" alt="dairy-products">
      <div class="btn-container">
        <button class="view-more-btn" type="button" name="button">VIEW MORE</button>
      </div>
    </div>

    <!-- THIS IS THE COLD MEAT CATEGORY -->
    <div class="product-container">
      <p class="cat-text">Cold meat</p>
      <img src="images/deli_images.jpg" alt="dairy-products">
      <div class="btn-container">
        <button class="view-more-btn" type="button" name="button">VIEW MORE</button>
      </div>
    </div>

    <!-- THIS IS THE FFRUIT AND VEG CATEGORY -->
    <div class="product-container">
      <p class="cat-text">Fruit and veg</p>
      <img src="images/vegetables_img.jpg" alt="dairy-products">
      <div class="btn-container">
        <button class="view-more-btn" type="button" name="button">VIEW MORE</button>
      </div>
    </div>
    
    <!-- THIS IS THE SOCIAL MEDIA LINKS SECTION -->
    <div id="social-media-container">

      <div id="facebook-icon-container"> <img src="images/icons/fb-images.png"></div>
      <div id="instagram-icon-container"> <img src="images/icons/insta-images.png"></div>
      <div id="twitter-icon-container"> <img src="images/icons/twitter.png"></div>

    </div>
    
    <br>

    <!-- THIS IS THE HOLDER FOR THE FORM -->
    <div class="form-container">
      <div class="form-head-container"><img id="email-icon" src="images/icons/email-images.png">
      <p id="contact-us-label">Contact us</p>
      </div>

    
    
    <form action="">
      <label class="form-item" for="fname">First Name</label>
      <input type="text" id="fname" name="firstname" placeholder="Your first name">
      <br><br>

      <label class="form-item" for="lname">Last Name</label>
      <input type="text" id="lname" name="lastname" placeholder="Your last name">
      <br><br>

      <label class="form-item" for="subject">Subject</label>
      <textarea id="subject" name="subject" placeholder="How can we help?"></textarea>
      <br><br>
      <input type="submit" id="submit-btn" value="Submit">
      </div>
  </div>
    
</body>
</html>
